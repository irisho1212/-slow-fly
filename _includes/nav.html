<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="index.html">漫飛民宿<span>SLOW FLY</span></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    <nav class="site-nav">
      {% for group in site.data.nav %}
      <div class="site-nav__group">
        <span class="site-nav__group-title">{{ group.group }}</span>
        <ul class="site-nav__list">
          {% for item in group.items %}
          <li><a href="{{ item.url }}"{% if page.url contains item.url %} class="is-active"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </nav>
  </div>
</header>
